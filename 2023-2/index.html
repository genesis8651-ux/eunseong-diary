async function unlock(pw){try{KEY=await mk(pw);const m=await dec(b64(ENC));try{localStorage.setItem('esd_pw',pw)}catch(e){}start(JSON.parse(new TextDecoder().decode(m)))}catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않아요';try{localStorage.removeItem('esd_pw')}catch(e){}}}
document.getElementById('go').onclick=()=>unlock(document.getElementById('pw').value);
document.getElementById('pw').onkeydown=e=>{if(e.key=='Enter')unlock(e.target.value)};
let saved=null;try{saved=localStorage.getItem('esd_pw')}catch(e){}
function start(DATA){document.getElementById('lock').style.display='none';document.getElementById('home').style.display='';
window.P=DATA;
const months=[...new Set(P.map(p=>p.m))];let homeY=0,urls=[];
document.getElementById('cnt').textContent=P.length;
document.getElementById('nav').innerHTML=months.map((m,i)=>`<a tabindex="0" role="button" data-m="${i}">${m.slice(6)}</a>`).join('');
document.getElementById('list').innerHTML=months.map((m,i)=>{const it=P.filter(p=>p.m==m);
 return `<h2 id="m${i}">${m}<span>${it.length}편</span></h2><div class="grid">`+it.map(p=>`<a class="card" href="#${p.id}"><img data-id="${p.id}" alt=""><b>${p.title}</b><small>${p.date} · 사진 ${p.n}장</small></a>`).join('')+'</div>'}).join('');
fetch('c.bin').then(r=>r.arrayBuffer()).then(dec).then(b=>JSON.parse(new TextDecoder().decode(b))).then(o=>document.querySelectorAll('img[data-id]').forEach(e=>{if(o[e.dataset.id])e.src='data:image/jpeg;base64,'+o[e.dataset.id]})).catch(()=>{});
document.getElementById('nav').onkeydown=e=>{if(e.key=='Enter')e.target.click()};document.getElementById('relock').onclick=()=>{try{localStorage.removeItem('esd_pw');sessionStorage.clear()}catch(e){}location.replace(location.pathname)};document.getElementById('nav').onclick=e=>{const m=e.target.dataset.m;if(m!=null)document.getElementById('m'+m).scrollIntoView({behavior:'smooth'})};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(){let id=location.hash.slice(1);if(/^d\d{4}-\d\d-\d\d$/.test(id)){const q=P.find(p=>p.iso==id.slice(1))||P.find(p=>p.iso>id.slice(1));if(q){history.replaceState(null,'','#'+q.id);id=q.id}}const i=P.findIndex(p=>p.id==id);const H=document.getElementById('home'),V=document.getElementById('post');
 urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
 if(i<0){V.style.display='none';H.style.display='';window.scrollTo(0,homeY);return}
 if(H.style.display!='none')homeY=window.scrollY;
 const p=P[i];let k=0,h='';
 for(const b of p.b){if(b[0]=='i'){for(let j=0;j<b[1];j++)h+=`<img data-k="${k++}" alt="">`}else if(b[0]=='p')h+=`<p>${esc(b[1])}</p>`;else h+=`<p class="c">${esc(b[1])}</p>`}
 V.innerHTML=`<div class="bar"><button onclick="location.hash=''">← 목록</button><span><button ${i?'':'disabled'} onclick="location.hash='${i?P[i-1].id:''}'">이전</button> <button ${i<P.length-1?'':'disabled'} onclick="location.hash='${i<P.length-1?P[i+1].id:''}'">다음</button></span></div>
 <div class="cat">은성이 성장일기</div><h1>${esc(p.date)} ${esc(p.title)}</h1><div class="by">엄마 · ${p.full}</div><div class="age">${esc(p.age)}</div>`+(p.kn&&p.kn.length?`<div class="kn"><b>🏫 그날 어린이집·유치원</b>${p.kn.map(x=>`<a href="${x[0]}">${esc(x[2])} · ${esc(x[1])} →</a>`).join('')}</div>`:'')+(p.loc?`<div class="loc">📍 ${esc(p.loc.replace(/([가-힣]+시)([가-힣]+[구군])/,'$1 $2'))}</div>`:'')+h+`<div class="tags">${p.tags.map(t=>'#'+t).join(' ')}</div>`+(p.cam?`<div class="cam">${esc(p.cam)}</div>`:'')+'<div class="pn"></div><div class="ago" style="display:none"></div>';
 H.style.display='none';V.style.display='block';window.scrollTo(0,0);extra(p,i);
 fetch('p/'+p.f+'.bin').then(r=>r.arrayBuffer()).then(dec).then(buf=>{if(location.hash.slice(1)!=p.id)return;const v=new DataView(buf),L=buf.byteLength,n=v.getUint32(L-8,true),t=L-8-4*n;let o=0;
  V.querySelectorAll('img[data-k]').forEach(e=>{const j=+e.dataset.k;if(j<n){let off=0;for(let q=0;q<j;q++)off+=v.getUint32(t+4*q,true);const s=v.getUint32(t+4*j,true);const u=URL.createObjectURL(new Blob([new Uint8Array(buf,off,s)],{type:'image/jpeg'}));urls.push(u);e.src=u}})}).catch(()=>{})}
const HERE=location.origin+location.pathname,link=e=>e.u==HERE?'#'+e.id:e.u+'#'+e.id;let IX=null,TH=null;
const ld=f=>fetch(f).then(r=>r.arrayBuffer()).then(dec).then(b=>JSON.parse(new TextDecoder().decode(b)));
const ix=()=>IX||(IX=ld('../s.bin')),th=()=>TH||(TH=ld('../t.bin').catch(()=>[]));
const fillT=(R)=>th().then(T=>R.querySelectorAll('img[data-t]').forEach(m=>{const v=T[m.dataset.t];if(v)m.src='data:image/jpeg;base64,'+v}));
const Q=document.getElementById('q');let qt;
async function doSearch(){const s=Q.value.trim(),R=document.getElementById('res'),Li=document.getElementById('list'),N=document.getElementById('nav');
 try{sessionStorage.setItem('esq',s)}catch(e){}
 if(!s){R.innerHTML='';Li.style.display='';N.style.display='';return}
 const I=await ix();if(Q.value.trim()!=s)return;const ws=s.toLowerCase().split(/\s+/);
 const hit=[];I.forEach((e,i)=>{const t=(e.t+' '+e.x+' '+e.l+' '+e.g+' '+e.d+' '+e.h).toLowerCase();if(ws.every(w=>t.includes(w)))hit.push([e,i])});
 Li.style.display='none';N.style.display='none';
 R.innerHTML=`<h2>‘${esc(s)}’ 검색 결과<span>${hit.length}편</span></h2>`+(hit.length?'<div class="grid">'+hit.slice(0,300).map(([e,i])=>`<a class="card" href="${link(e)}"><img data-t="${i}" alt=""><b>${esc(e.t)}</b><small>${e.d} · ${e.h}</small></a>`).join('')+'</div>':'<p class="none">찾는 글이 없어요</p>');
 fillT(R)}
Q.oninput=()=>{clearTimeout(qt);qt=setTimeout(doSearch,250)};
try{const nv=performance.getEntriesByType('navigation')[0];const s0=sessionStorage.getItem('esq');if(s0&&nv&&nv.type=='back_forward'){Q.value=s0;doSearch()}}catch(e){}
function extra(p,i){const V=document.getElementById('post'),S=document.querySelector('.sw select');
 V.querySelectorAll('img[data-k]').forEach(m=>m.onclick=()=>lbOpen(m));
 const it=(q,lab,cl)=>`<a ${cl?'class="r" ':''}href="#${q.id}"><small>${lab}</small>${esc(q.date)} ${esc(q.title)}</a>`;
 const half=(d,lab)=>{if(!S)return '<span></span>';const o=S.options[S.selectedIndex+d];return o?`<a ${d>0?'class="r" ':''}href="${o.value}"><small>${lab}</small>${o.text}</a>`:'<span></span>'};
 V.querySelector('.pn').innerHTML=(i?it(P[i-1],'← 이전 글'):half(-1,'← 이전 반기'))+(i<P.length-1?it(P[i+1],'다음 글 →',1):half(1,'다음 반기 →'));
 ix().then(I=>{if(location.hash.slice(1)!=p.id)return;const py=+p.iso.slice(0,4),t0=Date.UTC(py,+p.iso.slice(5,7)-1,+p.iso.slice(8,10)),best={};
  I.forEach((e,j)=>{const y=+e.iso.slice(0,4);if(y==py)return;const d=Math.abs(Date.UTC(py,+e.iso.slice(5,7)-1,+e.iso.slice(8,10))-t0)/864e5;if(d<=4&&(!best[y]||d<best[y][1]))best[y]=[j,d]});
  const ys=Object.keys(best).sort((a,b)=>b-a);if(!ys.length)return;const A=V.querySelector('.ago');
  A.innerHTML='<b>📅 이맘때 은성이</b><div class="row">'+ys.map(y=>{const j=best[y][0],e=I[j],n=py-y;return `<a href="${link(e)}"><img data-t="${j}" alt=""><small>${n>0?n+'년 전':(-n)+'년 뒤'} · ${e.d.slice(0,8)}</small><br>${esc(e.t)}</a>`}).join('')+'</div>';A.style.display='';fillT(A)}).catch(()=>{})}
const LB=document.getElementById('lb'),LI=LB.querySelector('img');let lbI=[],lbK=0,sx=0,sy=0,multi=false;
const lbShow=()=>{LI.src=lbI[lbK].src;LB.querySelector('span').textContent=(lbK+1)+' / '+lbI.length};
const lbGo=d=>{const k=lbK+d;if(k>=0&&k<lbI.length){lbK=k;lbShow()}};
function lbOpen(m){if(!m.src)return;lbI=[...document.querySelectorAll('#post img[data-k]')].filter(x=>x.src);lbK=lbI.indexOf(m);LB.style.display='flex';document.body.style.overflow='hidden';lbShow();history.pushState({lb:1},'')}
const lbHide=()=>{LB.style.display='none';document.body.style.overflow=''};
LB.querySelector('.x').onclick=()=>history.back();LB.querySelector('.l').onclick=()=>lbGo(-1);LB.querySelector('.r').onclick=()=>lbGo(1);
window.addEventListener('popstate',()=>{if(LB.style.display=='flex')lbHide()});
LB.addEventListener('touchstart',e=>{multi=e.touches.length>1;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
LB.addEventListener('touchend',e=>{if(multi)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))lbGo(dx<0?1:-1);else if(dy>90)history.back()},{passive:true});
document.addEventListener('keydown',e=>{if(LB.style.display!='flex')return;if(e.key=='ArrowLeft')lbGo(-1);else if(e.key=='ArrowRight')lbGo(1);else if(e.key=='Escape')history.back()});
const TOP=document.getElementById('top');addEventListener('scroll',()=>{TOP.style.display=scrollY>700?'block':'none'},{passive:true});TOP.onclick=()=>scrollTo({top:0,behavior:'smooth'});
window.addEventListener('hashchange',render);render();}
if(saved)unlock(saved);
</script></body></html>
