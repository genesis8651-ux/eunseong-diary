const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mk(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('eunseong-diary-v1'),iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt'])}
async function dec(buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12))}
async function unlock(pw){try{KEY=await mk(pw);const m=await dec(b64(ENC));try{localStorage.setItem('esd_pw',pw)}catch(e){}start(JSON.parse(new TextDecoder().decode(m)))}catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않아요';try{localStorage.removeItem('esd_pw')}catch(e){}}}
document.getElementById('go').onclick=()=>unlock(document.getElementById('pw').value);
document.getElementById('pw').onkeydown=e=>{if(e.key=='Enter')unlock(e.target.value)};
let saved=null;try{saved=localStorage.getItem('esd_pw')}catch(e){}
function start(DATA){document.getElementById('lock').style.display='none';document.getElementById('home').style.display='';
window.P=DATA;
const months=[...new Set(P.map(p=>p.m))];let homeY=0,urls=[];
document.getElementById('cnt').textContent=P.length;
document.getElementById('nav').innerHTML=months.map((m,i)=>`<a data-m="${i}">${m.slice(6)}</a>`).join('');
document.getElementById('list').innerHTML=months.map((m,i)=>{const it=P.filter(p=>p.m==m);
 return `<h2 id="m${i}">${m}<span>${it.length}편</span></h2><div class="grid">`+it.map(p=>`<a class="card" href="#${p.id}"><img data-id="${p.id}" alt=""><b>${p.title}</b><small>${p.date} · 사진 ${p.n}장</small></a>`).join('')+'</div>'}).join('');
fetch('c.bin').then(r=>r.arrayBuffer()).then(dec).then(b=>JSON.parse(new TextDecoder().decode(b))).then(o=>document.querySelectorAll('img[data-id]').forEach(e=>{if(o[e.dataset.id])e.src='data:image/jpeg;base64,'+o[e.dataset.id]})).catch(()=>{});
document.getElementById('nav').onclick=e=>{const m=e.target.dataset.m;if(m!=null)document.getElementById('m'+m).scrollIntoView({behavior:'smooth'})};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(){let id=location.hash.slice(1);if(/^d\d{4}-\d\d-\d\d$/.test(id)){const q=P.find(p=>p.iso==id.slice(1))||P.find(p=>p.iso>id.slice(1));if(q){history.replaceState(null,'','#'+q.id);id=q.id}}const i=P.findIndex(p=>p.id==id);const H=document.getElementById('home'),V=document.getElementById('post');
 urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
 if(i<0){V.style.display='none';H.style.display='';window.scrollTo(0,homeY);return}
 if(H.style.display!='none')homeY=window.scrollY;
 const p=P[i];let k=0,h='';
 for(const b of p.b){if(b[0]=='i'){for(let j=0;j<b[1];j++)h+=`<img data-k="${k++}" alt="">`}else if(b[0]=='p')h+=`<p>${esc(b[1])}</p>`;else h+=`<p class="c">${esc(b[1])}</p>`}
 V.innerHTML=`<div class="bar"><button onclick="location.hash=''">← 목록</button><span><button ${i?'':'disabled'} onclick="location.hash='${i?P[i-1].id:''}'">이전</button> <button ${i<P.length-1?'':'disabled'} onclick="location.hash='${i<P.length-1?P[i+1].id:''}'">다음</button></span></div>
 <div class="cat">은성이 성장일기</div><h1>${esc(p.date)} ${esc(p.title)}</h1><div class="by">엄마 · ${p.full}</div><div class="age">${esc(p.age)}</div>`+(p.kn&&p.kn.length?`<div class="kn"><b>🏫 그날 어린이집·유치원</b>${p.kn.map(x=>`<a href="${x[0]}">${esc(x[2])} · ${esc(x[1])} →</a>`).join('')}</div>`:'')+(p.loc?`<div class="loc">📍 ${esc(p.loc)}</div>`:'')+h+`<div class="tags">${p.tags.map(t=>'#'+t).join(' ')}</div>`+(p.cam?`<div class="cam">${esc(p.cam)}</div>`:'');
 H.style.display='none';V.style.display='block';window.scrollTo(0,0);
 fetch('p/'+p.f+'.bin').then(r=>r.arrayBuffer()).then(dec).then(buf=>{if(location.hash.slice(1)!=p.id)return;const v=new DataView(buf),L=buf.byteLength,n=v.getUint32(L-8,true),t=L-8-4*n;let o=0;
  V.querySelectorAll('img[data-k]').forEach(e=>{const j=+e.dataset.k;if(j<n){let off=0;for(let q=0;q<j;q++)off+=v.getUint32(t+4*q,true);const s=v.getUint32(t+4*j,true);const u=URL.createObjectURL(new Blob([new Uint8Array(buf,off,s)],{type:'image/jpeg'}));urls.push(u);e.src=u}})}).catch(()=>{})}
window.addEventListener('hashchange',render);render();}
if(saved)unlock(saved);
</script></body></html>
